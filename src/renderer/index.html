<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.uulucky.com; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none';" />
<meta name="referrer" content="no-referrer" />
<title>DeepSeek</title>
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <header class="surface-bar" id="surface-bar">
    <div class="surface-switch" role="tablist" aria-label="DeepSeek 模式">
      <button class="surface-tab active" id="surface-workbench" type="button" role="tab" aria-selected="true">工作台 <span>Harness</span></button>
      <button class="surface-tab" id="surface-web" type="button" role="tab" aria-selected="false">网页版 <span>免费</span></button>
    </div>
    <div class="surface-status" id="surface-status">本地工作台</div>
    <button class="surface-reload" id="surface-reload" type="button" title="重新加载 DeepSeek 网页版" hidden>重新加载</button>
  </header>
  <div class="app" id="app">

    <!-- ── Left rail ─────────────────────────────────────────────────────── -->
    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div class="brand-text">
            <div class="brand-name">DeepSeek</div>
            <div class="brand-sub" id="brand-sub">本地内核已连接</div>
          </div>
        </div>
        <button class="rail-collapse" id="rail-collapse" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span id="new-chat-label">新建对话</span>
      </button>

      <div class="session-toolbar">
        <label class="session-search" for="session-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M16 16l4 4" /></svg>
          <input id="session-search" type="search" autocomplete="off" placeholder="搜索对话内容" />
        </label>
        <button class="workspace-add" id="add-workspace" title="添加工作区" aria-label="添加工作区">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z" /><path d="M16 12v5M13.5 14.5h5" /></svg>
        </button>
      </div>

      <div class="rail-section">
        <div class="rail-section-head">
          <span id="sessions-status" aria-live="polite">对话</span>
          <span class="rail-section-actions">
            <button class="ghost-icon" id="toggle-archived" title="查看已归档对话" aria-label="查看已归档对话">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6" /></svg>
            </button>
            <button class="ghost-icon" id="refresh-sessions" title="刷新列表" aria-label="刷新列表">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
            </button>
          </span>
        </div>
        <div class="session-list" id="session-list"></div>
      </div>

      <!-- Ad slot: bottom of the conversation column, above profile/settings -->
      <div class="ad-slot" id="ad-slot" hidden></div>

      <div class="rail-foot">
        <button class="rail-row" id="open-profile">
          <span class="avatar" id="profile-avatar">D</span>
          <span class="rail-row-text">
            <span class="rail-row-title" id="profile-name">个人信息</span>
            <span class="rail-row-sub" id="profile-sub">查看账号与余额</span>
          </span>
        </button>
        <div class="rail-settings-row">
          <button class="rail-row rail-settings-main" id="open-settings">
            <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z" /></svg>
            <span class="rail-row-text">
              <span class="rail-row-title">设置</span>
              <span class="rail-row-sub" id="settings-sub">模型、外观与运行设置</span>
            </span>
          </button>
          <button class="update-pill" id="update-btn" title="下载并安装新版本" hidden>更新</button>
        </div>
      </div>
    </aside>

    <!-- ── Conversation column ───────────────────────────────────────────── -->
    <main class="main">
      <header class="titlebar">
        <button class="ghost-icon titlebar-menu" id="rail-toggle" title="显示/隐藏侧边栏" aria-label="显示/隐藏侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="titlebar-title">
          <span id="chat-title">新对话</span>
          <span class="titlebar-sub" id="chat-sub"></span>
        </div>
        <div class="titlebar-right">
          <div class="model-chip" id="model-chip" role="button" tabindex="0" title="切换模型">
            <span class="dot" id="model-dot"></span>
            <span id="model-name">模型</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </div>
          <div class="balance-chip" id="balance-chip" role="button" tabindex="0" title="查看余额 / 充值">
            <span id="balance-text">余额 --</span>
            <span class="balance-separator">·</span>
            <span id="usage-text">今日 --</span>
          </div>
        </div>
      </header>

      <section class="stream" id="stream">
        <div class="stream-inner" id="stream-inner"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <div class="attachment-drafts" id="attachment-drafts" hidden></div>
          <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button class="attach-btn" id="attach-btn" type="button" title="添加图片或文件" aria-label="添加图片或文件">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
              <input id="file-input" type="file" multiple hidden />
              <div class="reasoning-control" id="reasoning-control" hidden>
                <span class="reasoning-title">推理</span>
                <input id="reasoning-slider" class="reasoning-slider" type="range" min="0" max="0" step="1" value="0" aria-label="推理等级" />
                <span class="reasoning-value" id="reasoning-value">默认</span>
              </div>
              <span class="composer-hint" id="composer-hint"></span>
            </div>
            <div class="composer-right">
              <div class="permission-control" id="permission-control">
                <span class="permission-title">权限</span>
                <input id="permission-slider" class="permission-slider" type="range" min="0" max="2" step="1" value="2" aria-label="权限等级" aria-describedby="permission-warning" />
                <span class="permission-value" id="permission-value">完全</span>
              </div>
              <button class="stop-btn" id="stop-btn" type="button" hidden>停止</button>
              <button class="send-btn" id="send-btn" type="button" title="发送" aria-label="发送">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z" /></svg>
              </button>
            </div>
          </div>
          <div class="permission-warning" id="permission-warning" role="status">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
            <span><strong>Full Access 已开启</strong> · 可读写工作目录外的文件、执行命令，不逐次请求批准。请只运行可信任务。</span>
          </div>
        </div>
        <div class="context-usage" id="context-usage" aria-live="polite">上下文：发送第一条消息后显示</div>
        <div class="composer-note">内容由 DeepSeek 模型生成，请自行核查重要信息。</div>
      </footer>
    </main>
  </div>

  <!-- ── Model picker ────────────────────────────────────────────────────── -->
  <div class="popover" id="model-popover" hidden>
    <div class="popover-head">选择模型</div>
    <div class="popover-body" id="model-list"></div>
    <div class="popover-foot" id="model-foot"></div>
  </div>

  <!-- ── Conversation actions ───────────────────────────────────────────── -->
  <div class="session-popover" id="session-popover" role="menu" hidden>
    <button role="menuitem" data-session-action="rename">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" /></svg>
      <span>重命名</span>
    </button>
    <button role="menuitem" data-session-action="fork">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v6a4 4 0 0 0 4 4h6M14 11l3 3-3 3M7 4l-3 3 3 3" /></svg>
      <span>从此处创建新对话</span>
    </button>
    <button class="danger" role="menuitem" data-session-action="archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6" /></svg>
      <span>归档</span>
    </button>
  </div>

  <!-- ── Small action dialog (rename / archive confirmation) ───────────── -->
  <div class="action-backdrop" id="action-backdrop" hidden>
    <div class="action-dialog" role="dialog" aria-modal="true" aria-labelledby="action-title">
      <div class="action-icon" id="action-icon"></div>
      <div class="action-content">
        <h2 id="action-title"></h2>
        <p id="action-message"></p>
        <input class="input" id="action-input" type="text" maxlength="120" hidden />
        <div class="action-buttons">
          <button class="btn" id="action-cancel">取消</button>
          <button class="btn primary" id="action-confirm">确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modal host (settings / account) ─────────────────────────────────── -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <div class="tabs" id="modal-tabs"></div>
        <button class="ghost-icon" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <div class="renderer-error" id="renderer-error" role="alert" hidden>
    <div class="renderer-error-card">
      <div class="renderer-error-mark">!</div>
      <h1>界面加载遇到问题</h1>
      <p>本地对话和登录信息没有丢失。请重新打开客户端；若问题仍存在，可在设置中查看日志并反馈。</p>
      <pre id="renderer-error-detail"></pre>
    </div>
  </div>

  <script src="scripts/markdown.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/chat-view.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/account.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
