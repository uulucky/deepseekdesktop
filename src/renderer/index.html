<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.uulucky.com; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none';" />
<meta name="referrer" content="no-referrer" />
<title>DeepSeek</title>
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ── Left rail ─────────────────────────────────────────────────────── -->
    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div class="brand-text">
            <div class="brand-name">DeepSeek</div>
            <div class="brand-sub" id="brand-sub">本地内核已连接</div>
          </div>
        </div>
        <button class="rail-collapse" id="rail-collapse" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>新建对话</span>
      </button>

      <div class="rail-section">
        <div class="rail-section-head">
          <span>对话</span>
          <button class="ghost-icon" id="refresh-sessions" title="刷新列表" aria-label="刷新列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
          </button>
        </div>
        <div class="session-list" id="session-list"></div>
      </div>

      <!-- Ad slot: bottom of the conversation column, above profile/settings -->
      <div class="ad-slot" id="ad-slot" hidden></div>

      <div class="rail-foot">
        <button class="rail-row" id="open-profile">
          <span class="avatar" id="profile-avatar">D</span>
          <span class="rail-row-text">
            <span class="rail-row-title" id="profile-name">个人信息</span>
            <span class="rail-row-sub" id="profile-sub">查看账号与余额</span>
          </span>
        </button>
        <div class="rail-settings-row">
          <button class="rail-row rail-settings-main" id="open-settings">
            <svg class="rail-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z" /></svg>
            <span class="rail-row-text">
              <span class="rail-row-title">设置</span>
              <span class="rail-row-sub" id="settings-sub">模型、外观与运行设置</span>
            </span>
          </button>
          <button class="update-pill" id="update-btn" title="下载并安装新版本" hidden>更新</button>
        </div>
      </div>
    </aside>

    <!-- ── Conversation column ───────────────────────────────────────────── -->
    <main class="main">
      <header class="titlebar">
        <button class="ghost-icon titlebar-menu" id="rail-toggle" title="显示/隐藏侧边栏" aria-label="显示/隐藏侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="titlebar-title">
          <span id="chat-title">新对话</span>
          <span class="titlebar-sub" id="chat-sub"></span>
        </div>
        <div class="titlebar-right">
          <div class="model-chip" id="model-chip" role="button" tabindex="0" title="切换模型">
            <span class="dot" id="model-dot"></span>
            <span id="model-name">模型</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </div>
          <div class="balance-chip" id="balance-chip" role="button" tabindex="0" title="查看余额 / 充值">
            <span id="balance-text">余额 --</span>
            <span class="balance-separator">·</span>
            <span id="usage-text">今日 --</span>
          </div>
        </div>
      </header>

      <section class="stream" id="stream">
        <div class="stream-inner" id="stream-inner"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <div class="reasoning-control" id="reasoning-control" hidden>
                <span class="reasoning-title">推理</span>
                <input id="reasoning-slider" class="reasoning-slider" type="range" min="0" max="0" step="1" value="0" aria-label="推理等级" />
                <span class="reasoning-value" id="reasoning-value">默认</span>
              </div>
              <span class="composer-hint" id="composer-hint"></span>
            </div>
            <div class="composer-right">
              <div class="permission-control" id="permission-control">
                <span class="permission-title">权限</span>
                <input id="permission-slider" class="permission-slider" type="range" min="0" max="2" step="1" value="0" aria-label="权限等级" />
                <span class="permission-value" id="permission-value">只读</span>
              </div>
              <button class="stop-btn" id="stop-btn" type="button" hidden>停止</button>
              <button class="send-btn" id="send-btn" type="button" title="发送" aria-label="发送">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z" /></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="composer-note">内容由 DeepSeek 模型生成，请自行核查重要信息。</div>
      </footer>
    </main>
  </div>

  <!-- ── Model picker ────────────────────────────────────────────────────── -->
  <div class="popover" id="model-popover" hidden>
    <div class="popover-head">选择模型</div>
    <div class="popover-body" id="model-list"></div>
    <div class="popover-foot" id="model-foot"></div>
  </div>

  <!-- ── Modal host (settings / account) ─────────────────────────────────── -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <div class="tabs" id="modal-tabs"></div>
        <button class="ghost-icon" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Full Access needs an explicit, app-native safety confirmation. -->
  <div class="risk-backdrop" id="permission-confirm-backdrop" hidden>
    <section class="risk-dialog" role="alertdialog" aria-modal="true" aria-labelledby="permission-confirm-title" aria-describedby="permission-confirm-copy">
      <div class="risk-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
      </div>
      <div class="risk-content">
        <div class="risk-eyebrow">权限升级</div>
        <h2 id="permission-confirm-title">启用 Full Access？</h2>
        <p id="permission-confirm-copy">DeepSeek 将能够读写工作目录外的文件，并执行不受沙箱限制的命令。</p>
        <div class="risk-warning">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
          <span>此模式不会再弹出单次批准请求。请只在任务与文件来源可信时启用。</span>
        </div>
        <div class="risk-actions">
          <button class="risk-btn" id="permission-confirm-cancel" type="button">保留当前权限</button>
          <button class="risk-btn danger" id="permission-confirm-accept" type="button">确认启用 Full Access</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast-host" id="toast-host"></div>

  <script src="scripts/markdown.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/chat-view.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/account.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
