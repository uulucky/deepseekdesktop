name: Windows build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['updates/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GO111MODULE: 'off'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage and verify locked Windows runtime
        run: npm run runtime:stage
      - name: Contract and security tests
        run: npm test
      - name: Real isolated Harness integration (no paid API calls)
        run: npm run test:integration
      - name: Native updater tests
        run: go test -v ./build/update-bootstrap
      - name: Build portable artifacts from this source
        run: npm run dist:portable
      - name: Real packaged Windows UI and update extraction
        run: npm run test:packaged
      - name: Preserve public test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Preserve built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-artifacts
          path: |
            dist/DeepSeekDesktop-*.zip
            dist/DeepSeekDesktop-*-update-bootstrap.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json
            dist/unsigned-update.json
          if-no-files-found: error
  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'uulucky/deepseekdesktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-artifacts
          path: dist
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/DeepSeekDesktop-*.zip
            dist/DeepSeekDesktop-*-update-bootstrap.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json
            dist/unsigned-update.json
      - name: Publish verified source-built release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $assets = @(Get-ChildItem dist/DeepSeekDesktop-*.zip, dist/DeepSeekDesktop-*-update-bootstrap.exe | ForEach-Object { $_.FullName })
          $assets += @('dist/SHA256SUMS.txt','dist/build-info.json','dist/sbom.cdx.json','dist/unsigned-update.json')
          gh release create $env:GITHUB_REF_NAME @assets --title "DeepSeek Desktop $version" --notes-file .github/release-notes.md --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
