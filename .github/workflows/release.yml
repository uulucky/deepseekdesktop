name: Windows build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['updates/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded main build can keep a packaged Electron process alive until the job timeout.
# Only the newest commit on one branch/ref is useful; tags use a different ref and keep their
# own formal release run.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GO111MODULE: 'off'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage and verify locked Windows runtime
        run: npm run runtime:stage
      - name: Contract and security tests
        run: npm test
      - name: Real isolated Harness integration (no paid API calls)
        run: npm run test:integration
      - name: Native updater tests
        run: go test -v ./build/update-bootstrap
      - name: Build portable artifacts from this source
        run: npm run dist:portable
      - name: Real packaged Windows UI and update extraction
        timeout-minutes: 8
        run: npm run test:packaged
      - name: Preserve public test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Preserve built artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-artifacts
          path: |
            dist/DeepSeekDesktop-*.zip
            dist/DeepSeekDesktop-*-update-bootstrap.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json
            dist/unsigned-update.json
          if-no-files-found: error
  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'uulucky/deepseekdesktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release-artifacts
          path: dist
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/DeepSeekDesktop-*.zip
            dist/DeepSeekDesktop-*-update-bootstrap.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/sbom.cdx.json
            dist/unsigned-update.json
      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/DeepSeekDesktop-*.zip dist/DeepSeekDesktop-*-update-bootstrap.exe; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish verified source-built release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $assets = @(Get-ChildItem dist/DeepSeekDesktop-*.zip, dist/DeepSeekDesktop-*-update-bootstrap.exe | ForEach-Object { $_.FullName })
          $assets += @('dist/SHA256SUMS.txt','dist/build-info.json','dist/sbom.cdx.json','dist/unsigned-update.json')
          gh release create $env:GITHUB_REF_NAME @assets --title "DeepSeek Desktop $version" --notes-file .github/release-notes.md --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
